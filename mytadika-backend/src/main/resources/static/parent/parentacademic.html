<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Academic Report – MyTadika</title>
    <script>
        if (!sessionStorage.getItem('token') && !localStorage.getItem('token')) {
            window.location.replace('/login.html');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: {
                fontFamily: { headline: ['Plus Jakarta Sans', 'sans-serif'], body: ['Be Vietnam Pro', 'sans-serif'] }
            }}
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 1s linear infinite; }
        @media print {
            aside, header, #print-hide { display: none !important; }
            main { margin-left: 0 !important; padding-top: 1rem !important; }
        }
    </style>
    <script src="/components/sidebar-loader.js"></script>
</head>
<body class="bg-[#fcf6e3] text-[#312f23] min-h-screen">

<main class="ml-64 pt-20 p-8 min-h-screen">
    <div class="max-w-5xl mx-auto">

        <!-- Page header -->
        <div class="mb-4 flex items-center justify-between" id="print-hide">
            <div>
                <h1 class="text-3xl font-black tracking-tight text-[#6c5a00] font-headline">Academic Report</h1>
                <p class="text-stone-500 text-sm mt-1">Term scores, grades &amp; progress</p>
            </div>
            <button onclick="window.print()" class="flex items-center gap-2 px-5 py-3 bg-[#ffd709] text-[#6c5a00] font-bold rounded-full hover:bg-[#f5cc00] transition-all shadow-sm text-sm">
                <span class="material-symbols-outlined text-xl">download</span>
                Download PDF
            </button>
        </div>

        <!-- Child switcher -->
        <div id="child-switcher" class="hidden flex gap-2 mb-4 flex-wrap" id="print-hide"></div>

        <div id="page-loading" class="py-24 flex justify-center">
            <span class="material-symbols-outlined text-4xl text-stone-300 spin">progress_activity</span>
        </div>

        <div id="empty-state" class="hidden bg-white rounded-2xl shadow-sm border border-stone-100 p-12 text-center text-stone-400">
            <span class="material-symbols-outlined text-5xl opacity-30">school</span>
            <p class="mt-3 text-sm">No children linked yet.</p>
        </div>

        <div id="report-wrap" class="hidden">
            <!-- Student header + term selector -->
            <div class="bg-white rounded-2xl shadow-sm border border-stone-100 p-6 mb-6 flex items-center justify-between flex-wrap gap-4">
                <div class="flex items-center gap-4">
                    <div id="student-avatar" class="w-14 h-14 rounded-full bg-[#ffd709]/30 flex items-center justify-center text-xl font-black text-[#6c5a00] overflow-hidden flex-shrink-0"></div>
                    <div>
                        <h2 id="student-name" class="text-lg font-black text-[#312f23] font-headline"></h2>
                        <p id="student-meta" class="text-xs text-stone-400"></p>
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-stone-400 uppercase tracking-wide mb-1">Term</label>
                    <select id="term-select" class="px-4 py-2 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-[#ffd709] text-sm bg-stone-50"></select>
                </div>
            </div>

            <div id="record-loading" class="py-24 flex justify-center">
                <span class="material-symbols-outlined text-4xl text-stone-300 spin">progress_activity</span>
            </div>

            <div id="no-records" class="hidden bg-white rounded-2xl shadow-sm border border-stone-100 p-12 text-center text-stone-400">
                <span class="material-symbols-outlined text-5xl opacity-30">grading</span>
                <p class="mt-3 text-sm">No academic record for this term yet.</p>
            </div>

            <div id="record-content" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Radar chart -->
                <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-stone-100 p-6">
                    <h3 class="text-sm font-bold text-[#312f23] font-headline mb-4">Subject Performance</h3>
                    <canvas id="radar-chart" height="260"></canvas>
                </div>

                <!-- Summary + breakdown -->
                <div class="flex flex-col gap-6">
                    <div class="bg-white rounded-2xl shadow-sm border border-stone-100 p-6 text-center">
                        <p class="text-[10px] font-bold text-stone-400 uppercase tracking-wide">Overall Grade</p>
                        <p id="summary-grade" class="text-5xl font-black text-[#6c5a00] font-headline my-2">–</p>
                        <p id="summary-label" class="text-sm font-semibold text-stone-600"></p>
                        <p id="summary-average" class="text-xs text-stone-400 mt-1"></p>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-stone-100 p-6 flex-1">
                        <h3 class="text-sm font-bold text-[#312f23] font-headline mb-3">Score Breakdown</h3>
                        <div id="score-breakdown" class="space-y-2"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</main>

<script>
    let myAccountId = localStorage.getItem('accountId') || sessionStorage.getItem('accountId');
    let children = [];
    let selectedStudentId = null;
    let records = [];
    let selectedRecordId = null;
    let radarChart = null;

    function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    async function loadChildren() {
        try {
            const res = await fetch(`/api/student/by-parent/${myAccountId}`);
            children = res.ok ? await res.json() : [];
        } catch (e) { children = []; }

        document.getElementById('page-loading').classList.add('hidden');
        if (!children.length) {
            document.getElementById('empty-state').classList.remove('hidden');
            return;
        }

        renderChildSwitcher();
        const requestedId = Number(new URLSearchParams(location.search).get('studentId'));
        const preselect = children.find(c => c.id === requestedId);
        selectChild(preselect ? preselect.id : children[0].id);
    }

    function renderChildSwitcher() {
        const wrap = document.getElementById('child-switcher');
        if (children.length <= 1) { wrap.classList.add('hidden'); return; }
        wrap.classList.remove('hidden');
        wrap.innerHTML = children.map(c => `
            <button onclick="selectChild(${c.id})" data-child-id="${c.id}"
                class="child-tab px-4 py-2 rounded-full text-sm font-bold transition-colors ${c.id === selectedStudentId ? 'bg-[#ffd709] text-[#6c5a00]' : 'bg-white border border-stone-200 text-stone-500 hover:bg-stone-50'}">
                ${esc(c.fullName)}
            </button>`).join('');
    }

    async function selectChild(studentId) {
        selectedStudentId = studentId;
        renderChildSwitcher();

        const child = children.find(c => c.id === studentId);
        document.getElementById('student-name').textContent = child ? child.fullName : '';
        document.getElementById('student-meta').textContent = child && child.classrooms && child.classrooms.length
            ? child.classrooms.map(cl => cl.name).join(', ') : 'No classroom yet';
        document.getElementById('student-avatar').textContent = child ? child.fullName.charAt(0).toUpperCase() : '?';

        document.getElementById('empty-state').classList.add('hidden');
        document.getElementById('report-wrap').classList.remove('hidden');

        await loadRecords();
    }

    async function loadRecords() {
        try {
            const res = await fetch(`/api/academic/students/${selectedStudentId}/records`);
            records = res.ok ? await res.json() : [];
        } catch (e) { records = []; }

        document.getElementById('record-loading').classList.add('hidden');
        const termSelect = document.getElementById('term-select');
        if (!records.length) {
            termSelect.innerHTML = '<option>No terms yet</option>';
            document.getElementById('no-records').classList.remove('hidden');
            document.getElementById('record-content').classList.add('hidden');
            return;
        }

        termSelect.innerHTML = records.map(r => `<option value="${r.id}">${esc(r.academicTerm)}</option>`).join('');
        termSelect.onchange = () => renderRecord(Number(termSelect.value));
        renderRecord(records[0].id);
    }

    function renderRecord(recordId) {
        selectedRecordId = recordId;
        document.getElementById('term-select').value = recordId;
        const record = records.find(r => r.id === recordId);
        if (!record) return;

        document.getElementById('no-records').classList.add('hidden');
        document.getElementById('record-content').classList.remove('hidden');

        document.getElementById('summary-grade').textContent = record.finalGrade;
        document.getElementById('summary-label').textContent = record.gradeLabel;
        document.getElementById('summary-average').textContent = `Average: ${record.averageMark.toFixed(1)} / 100`;

        const scores = record.scores || [];
        document.getElementById('score-breakdown').innerHTML = scores.map(s => `
            <div class="flex items-center justify-between text-sm">
                <span class="text-stone-600 font-medium">${esc(s.subject)}</span>
                <span class="font-bold text-[#312f23]">${s.score}</span>
            </div>`).join('') || '<p class="text-xs text-stone-400">No subjects recorded.</p>';

        const ctx = document.getElementById('radar-chart').getContext('2d');
        if (radarChart) radarChart.destroy();
        radarChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: scores.map(s => s.subject),
                datasets: [{
                    label: record.academicTerm,
                    data: scores.map(s => s.score),
                    backgroundColor: 'rgba(255, 215, 9, 0.25)',
                    borderColor: '#eeab00',
                    pointBackgroundColor: '#6c5a00',
                    borderWidth: 2
                }]
            },
            options: {
                scales: { r: { min: 0, max: 100, ticks: { stepSize: 20 } } },
                plugins: { legend: { display: false } }
            }
        });
    }

    document.addEventListener('DOMContentLoaded', async () => {
        loadSidebar('parent', 'report');
        loadTopbar('parent');
        if (!myAccountId) { window.location.href = '/login.html'; return; }
        await loadChildren();
    });
</script>
</body>
</html>
